<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#e6f7f7" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fdf4ec" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Theme Gradients -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15a8ab"/>
      <stop offset="100%" stop-color="#0d7779"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#e5893e"/>
    </linearGradient>

    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0c2340"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="cardBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0c2340" flood-opacity="0.12"/>
    </filter>

    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0c2340" flood-opacity="0.14"/>
    </filter>

    <filter id="glowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      /* Animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-14px); }
      }

      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(12px); }
      }

      @keyframes floatTilt1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(3deg); }
      }

      @keyframes floatTilt2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(-4deg); }
      }

      @keyframes pulseAura {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.06); opacity: 1; }
      }

      @keyframes spinOrbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes dashRotate {
        to { stroke-dashoffset: -120; }
      }

      @keyframes glowPulse {
        0%, 100% { opacity: 0.6; transform: scale(0.95); }
        50% { opacity: 1; transform: scale(1.1); }
      }

      @keyframes starTwinkle {
        0%, 100% { opacity: 0.3; transform: scale(0.7); }
        50% { opacity: 1; transform: scale(1.25); }
      }

      @keyframes barGrowth {
        0%, 100% { transform: scaleY(0.75); }
        50% { transform: scaleY(1.05); }
      }

      @keyframes waveHand {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(8deg); }
        75% { transform: rotate(-5deg); }
      }

      /* Animated Classes */
      .anim-aura {
        transform-origin: 300px 260px;
        animation: pulseAura 6s ease-in-out infinite;
      }
      .anim-orbit {
        transform-origin: 300px 260px;
        animation: spinOrbit 30s linear infinite;
      }
      .anim-orbit-dash {
        stroke-dasharray: 8, 12;
        animation: dashRotate 10s linear infinite;
      }
      .anim-float-main {
        animation: floatSlow 4.5s ease-in-out infinite;
      }
      .anim-cap {
        transform-origin: 430px 110px;
        animation: floatTilt1 4s ease-in-out infinite;
      }
      .anim-badge-left {
        transform-origin: 100px 210px;
        animation: floatTilt2 5s ease-in-out infinite 0.5s;
      }
      .anim-badge-right {
        transform-origin: 490px 290px;
        animation: floatSlow 4s ease-in-out infinite 1s;
      }
      .anim-trophy {
        transform-origin: 160px 100px;
        animation: floatTilt1 4.2s ease-in-out infinite 0.8s;
      }
      .anim-bulb {
        transform-origin: 470px 180px;
        animation: floatSlow 3.8s ease-in-out infinite 1.2s;
      }
      .anim-glow {
        transform-origin: 470px 180px;
        animation: glowPulse 2.5s ease-in-out infinite;
      }
      .anim-star-1 {
        transform-origin: 130px 170px;
        animation: starTwinkle 2.2s ease-in-out infinite;
      }
      .anim-star-2 {
        transform-origin: 480px 90px;
        animation: starTwinkle 2.8s ease-in-out infinite 0.6s;
      }
      .anim-star-3 {
        transform-origin: 220px 70px;
        animation: starTwinkle 2.5s ease-in-out infinite 1.1s;
      }
      .anim-bar-1 { transform-origin: 500px 335px; animation: barGrowth 2.5s ease-in-out infinite 0.2s; }
      .anim-bar-2 { transform-origin: 512px 335px; animation: barGrowth 2.5s ease-in-out infinite 0.5s; }
      .anim-bar-3 { transform-origin: 524px 335px; animation: barGrowth 2.5s ease-in-out infinite 0.8s; }
      .anim-bar-4 { transform-origin: 536px 335px; animation: barGrowth 2.5s ease-in-out infinite 1.1s; }
    </style>
  </defs>

  <!-- Background Base Aura -->
  <circle cx="300" cy="265" r="230" fill="url(#bgGlow)" class="anim-aura"/>

  <!-- Decorative Orbit Rings -->
  <g class="anim-orbit">
    <circle cx="300" cy="260" r="195" fill="none" stroke="#139a9c" stroke-width="1.8" stroke-opacity="0.25" class="anim-orbit-dash"/>
    <circle cx="300" cy="260" r="225" fill="none" stroke="#e5893e" stroke-width="1.4" stroke-opacity="0.2" stroke-dasharray="6, 14"/>
    <circle cx="160" cy="120" r="5" fill="#139a9c" opacity="0.6"/>
    <circle cx="440" cy="390" r="6" fill="#e5893e" opacity="0.6"/>
    <circle cx="490" cy="180" r="4" fill="#0c2340" opacity="0.4"/>
  </g>

  <!-- Decorative Floating Twinkling Stars -->
  <g class="anim-star-1">
    <polygon points="130,158 133,167 142,170 133,173 130,182 127,173 118,170 127,167" fill="#f59e0b"/>
  </g>
  <g class="anim-star-2">
    <polygon points="480,78 483,87 492,90 483,93 480,102 477,93 468,90 477,87" fill="#139a9c"/>
  </g>
  <g class="anim-star-3">
    <polygon points="220,58 222,65 229,67 222,69 220,76 218,69 211,67 218,65" fill="#e5893e"/>
  </g>

  <!-- ============================================== -->
  <!-- MAIN ILLUSTRATION: Desk, Student & Classroom   -->
  <!-- ============================================== -->
  <g class="anim-float-main">
    <!-- Isometric Floor Shadow / Pedestal -->
    <ellipse cx="300" cy="455" rx="190" ry="24" fill="#0c2340" opacity="0.09"/>
    <ellipse cx="300" cy="453" rx="150" ry="16" fill="#139a9c" opacity="0.12"/>

    <!-- Modern Work Desk -->
    <g filter="url(#softShadow)">
      <!-- Desk Top -->
      <path d="M140 375 L460 375 C468 375, 474 381, 474 388 L474 394 C474 400, 468 405, 460 405 L140 405 C132 405, 126 400, 126 394 L126 388 C126 381, 132 375, 140 375 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <rect x="135" y="378" width="330" height="6" rx="3" fill="#f1f5f9"/>

      <!-- Desk Legs -->
      <line x1="165" y1="405" x2="165" y2="455" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
      <line x1="435" y1="405" x2="435" y2="455" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
      <line x1="150" y1="455" x2="180" y2="455" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
      <line x1="420" y1="455" x2="450" y2="455" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Student Character -->
    <!-- Chair Back -->
    <rect x="255" y="270" width="90" height="110" rx="16" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="265" y="280" width="70" height="90" rx="12" fill="#f8fafc"/>

    <!-- Student Body / Hoodie -->
    <path d="M245 375 C245 315, 270 295, 300 295 C330 295, 355 315, 355 375 Z" fill="url(#tealGrad)" filter="url(#softShadow)"/>
    <!-- Hoodie Strings -->
    <path d="M293 305 L291 330" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M307 305 L309 330" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="290" y="268" width="20" height="16" rx="4" fill="#fbcfe8"/>

    <!-- Head & Face -->
    <circle cx="300" cy="245" r="32" fill="#fed7aa"/>

    <!-- Hair -->
    <path d="M268 245 C268 220, 280 210, 300 210 C324 210, 334 222, 332 245 C328 232, 320 228, 300 228 C282 228, 274 235, 268 245 Z" fill="#0c2340"/>
    <path d="M272 235 C275 224, 285 218, 298 218 C308 218, 318 222, 325 228 C322 220, 312 215, 298 215 C286 215, 276 222, 272 235 Z" fill="#1e293b"/>

    <!-- Glasses -->
    <circle cx="288" cy="246" r="8" fill="none" stroke="#0c2340" stroke-width="2.2"/>
    <circle cx="312" cy="246" r="8" fill="none" stroke="#0c2340" stroke-width="2.2"/>
    <line x1="296" y1="246" x2="304" y2="246" stroke="#0c2340" stroke-width="2.2"/>

    <!-- Eyes (behind glasses) -->
    <circle cx="288" cy="246" r="2.5" fill="#0c2340"/>
    <circle cx="312" cy="246" r="2.5" fill="#0c2340"/>

    <!-- Cheerful Smile -->
    <path d="M294 260 Q300 266 306 260" fill="none" stroke="#ea580c" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Headphones -->
    <path d="M266 244 C266 220, 278 206, 300 206 C322 206, 334 220, 334 244" fill="none" stroke="#e5893e" stroke-width="4.5" stroke-linecap="round"/>
    <rect x="262" y="235" width="8" height="18" rx="4" fill="#e5893e"/>
    <rect x="330" y="235" width="8" height="18" rx="4" fill="#e5893e"/>

    <!-- Student Arms on Desk -->
    <ellipse cx="265" cy="370" rx="14" ry="8" fill="#0d7779"/>
    <ellipse cx="335" cy="370" rx="14" ry="8" fill="#0d7779"/>
    <circle cx="270" cy="372" r="7" fill="#fed7aa"/>
    <circle cx="330" cy="372" r="7" fill="#fed7aa"/>

    <!-- Modern Laptop on Desk -->
    <g filter="url(#softShadow)">
      <!-- Screen Back / Open -->
      <polygon points="265,372 272,312 328,312 335,372" fill="#1e293b"/>
      <!-- Glowing Display -->
      <polygon points="274,367 278,317 322,317 326,367" fill="url(#screenGlow)"/>
      <!-- Code / Graph Lines on Screen -->
      <line x1="284" y1="327" x2="316" y2="327" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
      <line x1="284" y1="334" x2="306" y2="334" stroke="#fde047" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
      <line x1="284" y1="341" x2="312" y2="341" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <line x1="284" y1="348" x2="300" y2="348" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
      <!-- Laptop Base -->
      <path d="M256 372 L344 372 L350 377 L250 377 Z" fill="#94a3b8"/>
      <rect x="288" y="373" width="24" height="2" rx="1" fill="#475569"/>
    </g>

    <!-- Stack of Colorful Books (Left of Laptop) -->
    <g filter="url(#softShadow)">
      <!-- Book 1 (Bottom, Blue) -->
      <rect x="180" y="362" width="55" height="12" rx="2" fill="#0284c7"/>
      <rect x="182" y="364" width="48" height="8" rx="1" fill="#38bdf8"/>
      <line x1="184" y1="368" x2="225" y2="368" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>

      <!-- Book 2 (Middle, Orange) -->
      <rect x="184" y="350" width="50" height="12" rx="2" fill="#ea580c"/>
      <rect x="186" y="352" width="44" height="8" rx="1" fill="#fb923c"/>
      <line x1="188" y1="356" x2="223" y2="356" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>

      <!-- Book 3 (Top, Teal) -->
      <rect x="182" y="338" width="48" height="12" rx="2" fill="#0f766e"/>
      <rect x="184" y="340" width="42" height="8" rx="1" fill="#14b8a6"/>
      <line x1="186" y1="344" x2="220" y2="344" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    </g>

    <!-- Coffee Mug / Pen Holder (Right of Laptop) -->
    <g filter="url(#softShadow)">
      <!-- Coffee Mug -->
      <rect x="375" y="350" width="22" height="24" rx="4" fill="#ffffff" stroke="#e5893e" stroke-width="2"/>
      <path d="M397 356 C402 356, 404 366, 397 368" fill="none" stroke="#e5893e" stroke-width="2"/>
      <circle cx="386" cy="362" r="4" fill="#139a9c"/>
      <!-- Steam -->
      <path d="M382 344 Q380 340 384 336" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M388 343 Q390 339 387 335" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- FLOATING BADGES & ANIMATED LEARNING ELEMENTS   -->
  <!-- ============================================== -->

  <!-- 1. Floating Graduation Cap (Top-Center-Right) -->
  <g class="anim-cap" filter="url(#cardShadow)">
    <polygon points="430,95 475,110 430,125 385,110" fill="#0c2340"/>
    <polygon points="430,98 470,111 430,123 390,111" fill="#1e3a5f"/>
    <!-- Skull Cap Base -->
    <path d="M405 117 L405 132 C405 142, 455 142, 455 132 L455 117 Z" fill="#0c2340"/>
    <!-- Gold Tassel -->
    <circle cx="430" cy="110" r="3.5" fill="#f59e0b"/>
    <path d="M430 110 Q455 120 460 140" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="460" cy="142" r="3" fill="#f59e0b"/>
  </g>

  <!-- 2. Golden Winner Trophy (Top Left) -->
  <g class="anim-trophy" filter="url(#cardShadow)">
    <circle cx="160" cy="105" r="36" fill="url(#cardBgGrad)" stroke="#fde68a" stroke-width="2"/>
    <!-- Cup -->
    <path d="M148 90 L172 90 L170 108 C169 116, 151 116, 150 108 Z" fill="url(#goldGrad)"/>
    <!-- Cup Handles -->
    <path d="M148 93 C142 93, 142 103, 148 105" fill="none" stroke="#d97706" stroke-width="2"/>
    <path d="M172 93 C178 93, 178 103, 172 105" fill="none" stroke="#d97706" stroke-width="2"/>
    <!-- Stem & Base -->
    <rect x="158" y="114" width="4" height="6" fill="#b45309"/>
    <rect x="152" y="120" width="16" height="5" rx="2" fill="#d97706"/>
    <!-- Star on Cup -->
    <polygon points="160,96 161.5,100 166,100 162.5,102.5 164,106.5 160,104 156,106.5 157.5,102.5 154,100 158.5,100" fill="#ffffff"/>
  </g>

  <!-- 3. Idea / Innovation Lightbulb (Right Middle) -->
  <g class="anim-bulb">
    <!-- Pulsing Glow Ring -->
    <circle cx="470" cy="180" r="28" fill="#fef08a" opacity="0.3" class="anim-glow"/>
    <g filter="url(#cardShadow)">
      <circle cx="470" cy="180" r="24" fill="url(#cardBgGrad)" stroke="#fde047" stroke-width="1.8"/>
      <!-- Lightbulb Icon -->
      <path d="M464 172 C464 167, 476 167, 476 172 C476 176, 473 178, 473 182 L467 182 C467 178, 464 176, 464 172 Z" fill="#f59e0b"/>
      <rect x="467" y="184" width="6" height="2" rx="1" fill="#64748b"/>
      <rect x="468" y="187" width="4" height="2" rx="1" fill="#94a3b8"/>
      <!-- Glow rays -->
      <line x1="470" y1="162" x2="470" y2="165" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
      <line x1="458" y1="168" x2="461" y2="170" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
      <line x1="482" y1="168" x2="479" y2="170" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 4. Left Feature Chip Card: "TOP RANKS" (Middle-Left) -->
  <g class="anim-badge-left" filter="url(#cardShadow)">
    <rect x="35" y="185" width="145" height="52" rx="14" fill="#ffffff" stroke="#e0f2fe" stroke-width="1.5"/>
    <!-- Icon Circle -->
    <circle cx="62" cy="211" r="17" fill="#e0f7f6"/>
    <!-- Star Icon in Circle -->
    <polygon points="62,201 64.5,207.5 71,207.5 66,211.5 68,218 62,214 56,218 58,211.5 53,207.5 59.5,207.5" fill="#139a9c"/>
    <!-- Text -->
    <text x="88" y="206" font-family="'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#0c2340">TOP RANKS</text>
    <text x="88" y="222" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#139a9c">NEET &amp; JEE 2026</text>
  </g>

  <!-- 5. Right Feature Card: "5000+ LEARNERS" with Growth Chart (Bottom-Right) -->
  <g class="anim-badge-right" filter="url(#cardShadow)">
    <rect x="425" y="260" width="140" height="74" rx="14" fill="#ffffff" stroke="#fef3c7" stroke-width="1.5"/>
    <text x="442" y="282" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#0c2340">SUCCESS RATE</text>
    <text x="442" y="299" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#e5893e">99.4%</text>

    <!-- Animated Mini Growth Bars -->
    <g>
      <rect x="442" y="324" width="8" height="6" rx="2" fill="#139a9c" opacity="0.3"/>
      <rect x="454" y="318" width="8" height="12" rx="2" fill="#139a9c" opacity="0.5"/>
      <rect x="466" y="312" width="8" height="18" rx="2" fill="#139a9c" opacity="0.75"/>
      <rect x="478" y="306" width="8" height="24" rx="2" fill="#139a9c"/>
      <polyline points="444,320 458,314 470,308 482,300" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
      <circle cx="482" cy="300" r="3" fill="#f59e0b"/>
    </g>

    <text x="500" y="322" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#10b981">+38% YoY</text>
  </g>

  <!-- 6. Left Bottom Mini Badge: Verified Quality -->
  <g class="anim-badge-left" filter="url(#cardShadow)" style="animation-delay: 1.5s;">
    <rect x="55" y="275" width="125" height="42" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <circle cx="75" cy="296" r="11" fill="#ecfdf5"/>
    <!-- Green Checkmark -->
    <polyline points="70,296 73,299 80,292" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="94" y="294" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#0c2340">VERIFIED</text>
    <text x="94" y="306" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#64748b">Top Mentors</text>
  </g>
</svg>
